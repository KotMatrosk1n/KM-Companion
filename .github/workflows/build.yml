name: Build

on:
  workflow_dispatch:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Use Node.js 26
      uses: actions/setup-node@v4
      with:
        node-version: 26
        check-latest: true
        cache: npm

    - name: Install dependencies
      run: npm ci

    - name: Install import dependency metadata
      run: npm ci --prefix import --ignore-scripts

    - name: Build
      run: npm run build

    - name: Lint
      run: npm run lint

    - name: Check dependency notices
      run: npm run check:third-party-notices

    - name: Check public workspace paths
      run: npm run check:workspace
